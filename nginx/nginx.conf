# Configuración de Nginx como reverse proxy delante de Next.js (y,
# opcionalmente, del servidor MCP en modo HTTP).
#
# Flujo de puesta en producción con dominio propio (ver README):
#   1. Sustituye `server_name` por tu dominio real (abajo).
#   2. Arranca solo con este bloque HTTP y emite el certificado con
#      certbot (usa la ruta /.well-known/acme-challenge/ ya configurada).
#   3. Descomenta el bloque `server` de 443 al final del archivo,
#      apuntando a los certificados emitidos, y recarga Nginx.
#   4. Este archivo NO incluye certificados ni secretos.

upstream transytel_web {
    server web:3000;
}

upstream transytel_mcp {
    server mcp:8787;
}

server {
    listen 80;
    server_name tu-dominio.example;

    client_max_body_size 10m;

    # Requerido por certbot (modo webroot) para validar el dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://transytel_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos de Next.js: cacheables de forma agresiva.
    location /_next/static/ {
        proxy_pass http://transytel_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- MCP (opcional: solo si expones el MCP a través del mismo dominio) ---
    # La autenticación por API key la sigue exigiendo el propio servidor MCP;
    # Nginx aquí solo hace de proxy TLS-terminating.
    location /mcp {
        proxy_pass http://transytel_mcp/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}

