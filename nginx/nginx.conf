# Configuración de ejemplo: Nginx como reverse proxy delante de Next.js
# (y, opcionalmente, del servidor MCP en modo HTTP).
#
# Uso en producción:
#   1. Sustituye `server_name` por tu dominio real.
#   2. Añade certificados TLS (p. ej. con certbot/Let's Encrypt) y un
#      bloque `server` adicional en el puerto 443 que redirija el 80.
#   3. Este archivo NO incluye certificados ni secretos.

upstream transytel_web {
    server web:3000;
}

upstream transytel_mcp {
    server mcp:8787;
}

server {
    listen 80;
    server_name tu-dominio.example;

    client_max_body_size 10m;

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://transytel_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos de Next.js: cacheables de forma agresiva.
    location /_next/static/ {
        proxy_pass http://transytel_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- MCP (opcional: solo si expones el MCP a través del mismo dominio) ---
    # La autenticación por API key la sigue exigiendo el propio servidor MCP;
    # Nginx aquí solo hace de proxy TLS-terminating.
    location /mcp {
        proxy_pass http://transytel_mcp/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
