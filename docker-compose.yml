services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      # Contenido compartido con el MCP: las noticias que la IA crea o
      # publica vía MCP se reflejan inmediatamente en la revista.
      - ./content:/app/content
      - ./public/images:/app/public/images
    expose:
      - "3000"
    # Solo accesible desde el propio servidor (127.0.0.1), nunca expuesto
    # directamente a internet. Un reverse proxy (el Nginx incluido más
    # abajo, o el Nginx/Apache del sistema si ya tienes otras webs en este
    # servidor) es quien lo publica hacia afuera. WEB_PORT evita chocar con
    # otros servicios que ya puedan estar usando el 3000 en este host.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MCP_TRANSPORT=http
      - MCP_PORT=8787
      - MCP_API_KEY=${MCP_API_KEY:?Define MCP_API_KEY en tu archivo .env}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./content:/app/content
      - ./public/images:/app/public/images
    expose:
      - "8787"
    # Igual que `web`: solo en localhost. MCP_HOST_PORT es el puerto en el
    # host; el puerto interno del contenedor (MCP_PORT, arriba) no cambia.
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8787}:8787"

  # --- Nginx + certbot incluidos: SOLO para un servidor dedicado a este
  # proyecto, donde nada más usa los puertos 80/443 todavía.
  #
  # Si el servidor ya tiene un Nginx/Apache del sistema sirviendo otras
  # webs (lo habitual), NO actives este perfil: en su lugar, añade un
  # nuevo server block al Nginx existente que apunte a
  # 127.0.0.1:${WEB_PORT:-3000} (ver sección "Servidor compartido" del
  # README). Así nunca se tocan los sitios que ya existen.
  #
  # Activar explícitamente con: docker compose --profile standalone-nginx up -d
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - mcp
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    profiles: ["standalone-nginx"]

  # Emite/renueva certificados Let's Encrypt para el Nginx incluido arriba.
  # Solo relevante junto al perfil standalone-nginx.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    profiles: ["standalone-nginx"]
