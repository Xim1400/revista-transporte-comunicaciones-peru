services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      # Contenido compartido con el MCP: las noticias que la IA crea o
      # publica vía MCP se reflejan inmediatamente en la revista.
      - ./content:/app/content
      - ./public/images:/app/public/images
    expose:
      - "3000"
    ports:
      - "3000:3000"

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MCP_TRANSPORT=http
      - MCP_PORT=8787
      - MCP_API_KEY=${MCP_API_KEY:?Define MCP_API_KEY en tu archivo .env}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./content:/app/content
      - ./public/images:/app/public/images
    expose:
      - "8787"
    ports:
      - "8787:8787"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - mcp
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

  # Emite/renueva certificados Let's Encrypt. No se ejecuta en segundo
  # plano: se invoca puntualmente (ver sección HTTPS del README).
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    profiles: ["certbot"]
